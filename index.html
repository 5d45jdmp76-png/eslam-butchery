<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eslam | Butchery</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f6f8;color:#222}
header{background:#17191c;color:#fff;padding:18px 24px;font-size:23px;font-weight:bold}
main{padding:24px;max-width:1200px;margin:auto}
h1{margin-top:0}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:#fff;padding:20px;border-radius:14px;box-shadow:0 3px 15px #00000010}
.label{color:#666}
.num{font-size:28px;font-weight:bold;margin-top:8px}
.gold{color:#b47a13}
.info{margin-top:20px;background:#fff;border-radius:14px;padding:20px}
@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.cards{grid-template-columns:1fr}}
</style>
</head>

<body>

<header>🥩 Eslam — Butchery Management System</header>

<main>
<h1>لوحة التحكم</h1>

<section class="cards">

<div class="card">
<div class="label">مبيعات اليوم</div>
<div class="num gold">0 ج.م</div>
</div>

<div class="card">
<div class="label">الفواتير</div>
<div class="num">0</div>
</div>

<div class="card">
<div class="label">الطلبات</div>
<div class="num">0</div>
</div>

<div class="card">
<div class="label">المصروفات</div>
<div class="num">0 ج.م</div>
</div>

</section>

<div class="info">
<h2>مرحبًا بك في Eslam</h2>
<p>
نظام إدارة محل الجزارة أونلاين.
</p>
<p>
من هنا هنقدر بعد كده ندير المنتجات والمخزون والمبيعات والعملاء والطلبات والمصروفات والتقارير.
</p>
</div>

</main>

</body>
</html>
